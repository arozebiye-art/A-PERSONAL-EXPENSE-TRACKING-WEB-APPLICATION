<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Manage your money wisely!</p>
    </header>

    <main>
        <section class="budget-section">
            <h2>Set Your Budget</h2>
            <input type="number" id="budgetInput" placeholder="Enter budget">
            <button id="setBudgetBtn">Set Budget</button>
        </section>

        <section class="summary">
            <h2>Budget Summary</h2>
            <p>Budget: KES <span id="budget">0</span></p>
            <p>Total Expenses: KES <span id="totalExpenses">0</span></p>
            <p>Remaining: KES <span id="remaining">0</span></p>
            <p id="message">Set your budget to get started.</p>
        </section>

        <section class="expense-section">
            <h2>Add Expense</h2>

            <input type="text" id="expenseName" placeholder="Expense name">
            <input type="number" id="expenseAmount" placeholder="Amount">

            <button id="addExpenseBtn">Add Expense</button>
        </section>

        <section class="expense-list">
            <h2>Expense Records</h2>
            <ul id="expenses"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
